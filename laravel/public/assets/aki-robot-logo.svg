<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">aKI Roboter-Logo</title>
  <desc id="description">Abstrakter Roboterkopf mit KI-Monogramm und Marktimpuls</desc>
  <defs>
    <linearGradient id="shell" x1="14" y1="12" x2="82" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="31" y1="31" x2="67" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8c769"/>
      <stop offset="1" stop-color="#d89b32"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M48 9v10" fill="none" stroke="#d8a647" stroke-width="4" stroke-linecap="round"/>
  <circle cx="48" cy="8" r="4" fill="#f8c769" filter="url(#glow)"/>

  <rect x="13" y="20" width="70" height="61" rx="21" fill="url(#shell)"/>
  <rect x="18" y="25" width="60" height="51" rx="17" fill="#102d31" stroke="#5eead4" stroke-opacity=".38"/>

  <path d="M13 45H8a4 4 0 0 0-4 4v12a4 4 0 0 0 4 4h5M83 45h5a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4h-5"
        fill="#174b4c" stroke="#2dd4bf" stroke-width="3"/>

  <circle cx="34" cy="45" r="6" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="62" cy="45" r="6" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="34" cy="45" r="2" fill="#fff8e8"/>
  <circle cx="62" cy="45" r="2" fill="#fff8e8"/>

  <path d="M29 63h8l5-7 7 11 6-9 4 5h8"
        fill="none" stroke="#f8c769" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M30 81v7M66 81v7" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>
  <path d="M24 89h18M54 89h18" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
</svg>
