<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Aktie auswählen und mit der KI analysieren</title>
  <desc id="desc">Aktienauswahl anhand vorhandener Kennzahlen mit integriertem KI-Chat</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb923c"/><stop offset=".52" stop-color="#fb923c"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c99a45" stop-opacity=".20"/><stop offset="1" stop-color="#9f7435" stop-opacity=".06"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="type-q1"><rect x="18" y="10" width="0" height="22"><animate attributeName="width" from="0" to="210" begin=".15s" dur=".8s" fill="freeze"/></rect></clipPath>
    <clipPath id="type-q2"><rect x="18" y="30" width="0" height="22"><animate attributeName="width" from="0" to="205" begin="1s" dur=".8s" fill="freeze"/></rect></clipPath>
    <clipPath id="type-head"><rect x="59" y="12" width="0" height="22"><animate attributeName="width" from="0" to="220" begin="3.1s" dur=".7s" fill="freeze"/></rect></clipPath>
    <clipPath id="type-a1"><rect x="75" y="42" width="0" height="20"><animate attributeName="width" from="0" to="205" begin="3.85s" dur=".55s" fill="freeze"/></rect></clipPath>
    <clipPath id="type-a2"><rect x="75" y="66" width="0" height="20"><animate attributeName="width" from="0" to="205" begin="4.45s" dur=".55s" fill="freeze"/></rect></clipPath>
    <clipPath id="type-a3"><rect x="75" y="90" width="0" height="20"><animate attributeName="width" from="0" to="235" begin="5.05s" dur=".75s" fill="freeze"/></rect></clipPath>
    <style>
      .text{fill:#f8fafc;font-family:Inter,Arial,sans-serif}.muted{fill:#8f9aae;font-family:Inter,Arial,sans-serif}.tiny{fill:#64748b;font-family:Inter,Arial,sans-serif}.card{fill:#202c46;stroke:#fb923c;stroke-opacity:.25}.flow{stroke-dasharray:8 10;animation:flow 2.8s linear infinite}.typing{opacity:0;animation:showThinking 1.05s ease 1.9s forwards}.typing circle{animation:thinkingDot .6s ease-in-out infinite}.typing circle:nth-child(2){animation-delay:.12s}.typing circle:nth-child(3){animation-delay:.24s}.ai-answer{opacity:0;animation:showAnswer .28s ease 2.95s forwards}.answer-row{opacity:0;animation:showRow .01s linear forwards}.answer-row-1{animation-delay:3.85s}.answer-row-2{animation-delay:4.45s}.answer-row-3{animation-delay:5.05s}@keyframes flow{to{stroke-dashoffset:-72}}@keyframes showThinking{0%,100%{opacity:0}15%,78%{opacity:1}}@keyframes thinkingDot{0%,100%{opacity:.28;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}@keyframes showAnswer{from{opacity:0}to{opacity:1}}@keyframes showRow{to{opacity:1}}@media (prefers-reduced-motion:reduce){.flow{animation:none}.typing{display:none}.ai-answer,.answer-row{opacity:1;animation:none}.typing circle{animation:none}}
    </style>
  </defs>
  <rect width="980" height="620" fill="#0b1424"/>
  <g opacity=".075" stroke="#fb923c"><path d="M65 95H915M65 165H915M65 235H915M65 305H915M65 375H915M65 445H915M65 515H915"/><path d="M105 60V550M215 60V550M325 60V550M435 60V550M545 60V550M655 60V550M765 60V550M875 60V550"/></g>
  <text class="text" x="490" y="66" text-anchor="middle" font-size="30" font-weight="900">Auswählen. Verstehen. Nachfragen.</text>
  <text class="muted" x="490" y="96" text-anchor="middle" font-size="15">Von vorhandenen Werten direkt zum KI-gestützten Dialog</text>

  <g transform="translate(65 130)">
    <rect class="card" width="420" height="420" rx="26"/>
    <text class="text" x="28" y="42" font-size="19" font-weight="900">Aktie auswählen</text>
    <text class="muted" x="28" y="67" font-size="12">Vergleiche verfügbare Werte auf einen Blick</text>
    <rect x="28" y="84" width="364" height="42" rx="12" fill="#0b1424" stroke="#334155"/>
    <circle cx="49" cy="105" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="m54 110 7 7" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <text class="tiny" x="76" y="110" font-size="12">Unternehmen oder Symbol suchen</text>
    <g transform="translate(28 143)"><text class="tiny" x="0" y="0" font-size="10" font-weight="700">AKTIE</text><text class="tiny" x="185" y="0" font-size="10" font-weight="700">KURS</text><text class="tiny" x="263" y="0" font-size="10" font-weight="700">TREND</text><text class="tiny" x="332" y="0" font-size="10" font-weight="700">KI</text></g>
    <g class="row" transform="translate(20 164)"><rect width="380" height="62" rx="14" fill="#ffffff" fill-opacity=".025"/><circle cx="29" cy="31" r="17" fill="#334155"/><text class="text" x="29" y="36" text-anchor="middle" font-size="11" font-weight="900">M</text><text class="text" x="57" y="27" font-size="13" font-weight="800">Microsoft</text><text class="tiny" x="57" y="44" font-size="10">MSFT</text><text class="text" x="193" y="35" font-size="12">$ 468</text><text x="270" y="35" fill="#fb923c" font-family="Inter,Arial" font-size="12">+1,4 %</text><text class="text" x="340" y="35" font-size="12" font-weight="900">82</text></g>
    <g transform="translate(20 234)" filter="url(#glow)"><rect width="380" height="62" rx="14" fill="url(#selected)" stroke="#c99a45" stroke-opacity=".68"/><circle cx="29" cy="31" r="17" fill="#c99a45" fill-opacity=".24"/><text class="text" x="29" y="36" text-anchor="middle" font-size="11" font-weight="900">A</text><text class="text" x="57" y="27" font-size="13" font-weight="800">Apple Inc.</text><text class="tiny" x="57" y="44" font-size="10">AAPL</text><text class="text" x="193" y="35" font-size="12">$ 198</text><text x="270" y="35" fill="#e6c875" font-family="Inter,Arial" font-size="12">+2,1 %</text><rect x="329" y="20" width="35" height="22" rx="11" fill="#b98538"/><text class="text" x="346" y="35" text-anchor="middle" font-size="11" font-weight="900">87</text></g>
    <g class="row" transform="translate(20 304)"><rect width="380" height="62" rx="14" fill="#ffffff" fill-opacity=".025"/><circle cx="29" cy="31" r="17" fill="#334155"/><text class="text" x="29" y="36" text-anchor="middle" font-size="11" font-weight="900">N</text><text class="text" x="57" y="27" font-size="13" font-weight="800">Nvidia</text><text class="tiny" x="57" y="44" font-size="10">NVDA</text><text class="text" x="193" y="35" font-size="12">$ 172</text><text x="270" y="35" fill="#fb7185" font-family="Inter,Arial" font-size="12">−0,8 %</text><text class="text" x="340" y="35" font-size="12" font-weight="900">74</text></g>
    <text class="muted" x="210" y="395" text-anchor="middle" font-size="11">Auswahl anhand transparenter Kennzahlen</text>
  </g>

  <path class="flow" d="M500 338H536" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><path d="m529 330 10 8-10 8" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(550 130)">
    <rect class="card" width="365" height="420" rx="26"/>
    <rect width="365" height="70" rx="26" fill="#172844"/><rect y="45" width="365" height="25" fill="#172844"/>
    <circle cx="35" cy="35" r="19" fill="url(#accent)"/><text class="text" x="35" y="40" text-anchor="middle" font-size="11" font-weight="900">KI</text><text class="text" x="66" y="30" font-size="14" font-weight="900">Aki</text><circle cx="70" cy="49" r="3" fill="#fb923c"/><text class="muted" x="79" y="53" font-size="9.5">dein KI-Analyseassistent</text>
    <g transform="translate(62 94)"><rect width="278" height="62" rx="16" fill="#334155" fill-opacity=".55"/><text class="text" x="18" y="26" font-size="11" clip-path="url(#type-q1)">Empfiehl mir heute drei</text><text class="text" x="18" y="45" font-size="11" clip-path="url(#type-q2)">interessante Aktien.</text></g>
    <g class="typing" transform="translate(34 190)"><circle cx="0" cy="0" r="3" fill="#fb923c"/><circle cx="11" cy="0" r="3" fill="#fb923c"/><circle cx="22" cy="0" r="3" fill="#fb923c"/></g>
    <g class="ai-answer" transform="translate(18 172)">
      <circle cx="18" cy="18" r="16" fill="url(#accent)"/><text class="text" x="18" y="22" text-anchor="middle" font-size="9" font-weight="900">KI</text>
      <rect x="43" width="286" height="128" rx="18" fill="#fb923c" fill-opacity=".16" stroke="#fb923c" stroke-opacity=".42"/>
      <text class="text" x="59" y="29" font-size="12" font-weight="800" clip-path="url(#type-head)">Heute im Analyse-Fokus:</text>
      <g class="answer-row answer-row-1"><circle cx="63" cy="53" r="3" fill="#fb923c"/><text class="muted" x="75" y="57" font-size="11" clip-path="url(#type-a1)">Apple · KI-Score 87</text></g>
      <g class="answer-row answer-row-2"><circle cx="63" cy="77" r="3" fill="#fb923c"/><text class="muted" x="75" y="81" font-size="11" clip-path="url(#type-a2)">Microsoft · KI-Score 82</text></g>
      <g class="answer-row answer-row-3"><circle cx="63" cy="101" r="3" fill="#fb923c"/><text class="muted" x="75" y="105" font-size="10.5" clip-path="url(#type-a3)">Nvidia · KI-Score 74</text></g>
    </g>
    <g transform="translate(24 324)"><rect width="317" height="54" rx="16" fill="#0b1424" stroke="#334155"/><text class="tiny" x="18" y="32" font-size="11">Frage zur ausgewählten Aktie stellen …</text><circle cx="290" cy="27" r="17" fill="#fb923c"/><path d="m284 27 7-6v12l-7-6Z" fill="#fff"/></g>
    <g transform="translate(40 389)"><rect width="285" height="23" rx="11.5" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".38"/><text class="muted" x="142.5" y="15" text-anchor="middle" font-size="9.5" font-weight="700">Fragenanzahl abhängig vom Chat-Tarif</text></g>
  </g>
</svg>
