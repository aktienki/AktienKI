<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Von Tradern für Trader</title>
  <desc id="desc">AktienKI verbindet praktische Markterfahrung mit intelligenter Technologie</desc>
  <defs>
