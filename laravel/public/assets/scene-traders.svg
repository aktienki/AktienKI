      <stop stop-color="#a79dbe"/><stop offset=".5" stop-color="#685b91"/><stop offset="1" stop-color="#6670b8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e6c875"/><stop offset=".55" stop-color="#c99a45"/><stop offset="1" stop-color="#9f7435"/>
    </linearGradient>
    <radialGradient id="core"><stop stop-color="#5c4c83" stop-opacity=".42"/><stop offset="1" stop-color="#120b2d"/></radialGradient>
    <radialGradient id="amberCore"><stop stop-color="#c99a45" stop-opacity=".24"/><stop offset=".62" stop-color="#3b2b19" stop-opacity=".36"/><stop offset="1" stop-color="#120b2d"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .text{fill:#fff;font-family:Inter,Arial,sans-serif}.muted{fill:#94a3b8;font-family:Inter,Arial,sans-serif}.line{fill:none;stroke:url(#violet);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.amber-line{stroke:url(#amber)}.flow{stroke-dasharray:10 12;animation:flow 4s linear infinite}@keyframes flow{to{stroke-dashoffset:-88}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>
  <rect width="980" height="620" fill="#070b22"/>
  <g opacity=".30" stroke="#2b1d5d"><path d="M70 100H910M70 170H910M70 240H910M70 310H910M70 380H910M70 450H910M70 520H910"/><path d="M110 65V550M220 65V550M330 65V550M440 65V550M550 65V550M660 65V550M770 65V550M880 65V550"/></g>

