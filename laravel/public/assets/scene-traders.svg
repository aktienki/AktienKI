  <text x="490" y="467" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#fff">aktien<tspan fill="#66568f" font-size="31" font-weight="900">KI</tspan><tspan fill="#fff" font-size="21">.com</tspan></text>
  <text class="muted" x="490" y="493" text-anchor="middle" font-size="12">Intelligence for decisions</text>

