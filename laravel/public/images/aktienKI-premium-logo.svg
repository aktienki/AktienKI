<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <style>
      .brand{font-family:Arial,Helvetica,sans-serif;font-weight:700}
      .tag{font-family:Arial,Helvetica,sans-serif;letter-spacing:7px}
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Icon -->
  <g transform="translate(40,35)">
    <path d="M45,305 A145,145 0 1 1 255,305" fill="none" stroke="url(#grad)" stroke-width="12"/>
    <path d="M52,250 C105,235 165,180 245,70"
          fill="none" stroke="url(#grad)" stroke-width="12"
          stroke-linecap="round"/>
    <polygon points="245,70 228,74 245,96" fill="url(#grad)"/>

    <rect x="70" y="220" width="36" height="80" rx="4" fill="url(#grad)"/>
    <rect x="125" y="180" width="36" height="120" rx="4" fill="url(#grad)"/>
    <rect x="180" y="120" width="36" height="180" rx="4" fill="url(#grad)"/>
  </g>

  <line x1="360" y1="60" x2="360" y2="340" stroke="#1F2937" stroke-width="4"/>

  <!-- Brand -->
  <text x="420" y="190" class="brand" font-size="122" fill="#0F172A">
    aktien<tspan fill="url(#grad)">KI</tspan>.com
  </text>

  <line x1="420" y1="270" x2="500" y2="270" stroke="url(#grad)" stroke-width="4"/>
  <line x1="1380" y1="270" x2="1460" y2="270" stroke="url(#grad)" stroke-width="4"/>

  <text x="530" y="282" class="tag" font-size="34" fill="#374151">
    MARKET INTELLIGENCE PLATFORM
  </text>
</svg>
