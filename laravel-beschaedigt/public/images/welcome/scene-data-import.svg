<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620"><style>.grid{stroke:#2b1d5d;stroke-width:1;opacity:.32}.soft{fill:#111636;stroke:#8b5cf6;stroke-opacity:.42}.text{fill:#fff;font-family:Inter,Arial,sans-serif}.muted{fill:#aeb8ca;font-family:Inter,Arial,sans-serif}.glow{filter:url(#glow)}.dot{fill:#a78bfa;animation:pulse 2s infinite}.flow{stroke-dasharray:12 12;animation:dash 5s linear infinite}.bar{animation:grow 2.2s ease-in-out infinite;transform-origin:bottom}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}</style><defs><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="line" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect width="980" height="620" fill="#070b22"/><g opacity=".55"><path class="grid" d="M80 80H900M80 140H900M80 200H900M80 260H900M80 320H900M80 380H900M80 440H900M80 500H900"/><path class="grid" d="M120 60V540M220 60V540M320 60V540M420 60V540M520 60V540M620 60V540M720 60V540M820 60V540"/></g><text class="text" x="75" y="82" font-size="24" font-weight="800">01 Datenimport</text><text class="muted" x="75" y="116" font-size="17">Kursdaten und Fundamentaldaten der letzten 10 Jahre</text><g class="soft"><rect x="75" y="165" width="210" height="120" rx="18"/><rect x="75" y="326" width="210" height="120" rx="18"/></g><text class="text" x="105" y="207" font-size="19" font-weight="800">Kursdaten</text><text class="muted" x="105" y="236" font-size="14">OHLCV · Volumen · Splits</text><text class="text" x="105" y="367" font-size="19" font-weight="800">Fundamentaldaten</text><text class="muted" x="105" y="396" font-size="14">Bilanz · Cashflow · Margen</text><path class="flow glow" d="M295 225 C430 170 510 235 620 225" fill="none" stroke="url(#line)" stroke-width="3"/><path class="flow glow" d="M295 385 C430 455 510 370 620 390" fill="none" stroke="url(#line)" stroke-width="3"/><g class="glow"><ellipse cx="705" cy="198" rx="122" ry="36" fill="#111636" stroke="#22d3ee" stroke-width="3"/><path d="M583 198V405c0 20 55 37 122 37s122-17 122-37V198" fill="#0b102b" stroke="#22d3ee" stroke-width="3"/><ellipse cx="705" cy="405" rx="122" ry="37" fill="#111636" stroke="#22d3ee" stroke-width="3"/><ellipse cx="705" cy="300" rx="122" ry="37" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="3"/><text class="text" x="705" y="307" font-size="34" font-weight="900" text-anchor="middle">DATA</text><text class="muted" x="705" y="338" font-size="16" text-anchor="middle">10 Jahre Historie</text></g><g><circle class="dot" cx="342" cy="213" r="5"/><circle class="dot" cx="397" cy="194" r="4"/><circle class="dot" cx="451" cy="225" r="6"/><circle class="dot" cx="521" cy="212" r="4"/><circle class="dot" cx="566" cy="228" r="5"/><circle class="dot" cx="339" cy="386" r="5"/><circle class="dot" cx="408" cy="421" r="4"/><circle class="dot" cx="475" cy="395" r="6"/><circle class="dot" cx="540" cy="377" r="4"/></g><g transform="translate(90 500)"><rect x="0" y="0" width="790" height="76" rx="18" fill="#070d20" stroke="#8b5cf6" stroke-opacity=".35"/><rect class="bar" x="42" y="25" width="18" height="34" fill="#8b5cf6"/><rect class="bar" x="78" y="18" width="18" height="41" fill="#7c3aed"/><rect class="bar" x="114" y="35" width="18" height="24" fill="#22d3ee"/><rect class="bar" x="150" y="12" width="18" height="47" fill="#a78bfa"/><text class="text" x="250" y="31" font-size="18" font-weight="800">Große Datenbasis</text><text class="muted" x="250" y="55" font-size="14">Aktien, Sektoren, Rohstoffe und Währungen werden vorbereitet.</text></g></svg>